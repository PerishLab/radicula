[package]
name = "radicula-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Explicit tool identity, command contexts and owned process execution"
readme = "README.md"
publish = ["perish"]

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
which = "8"
tokio = { version = "1", optional = true, features = ["rt", "process", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
