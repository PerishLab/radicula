[package]
name = "radicula-lock"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Scoped execution coordination over memory and caller-owned files"
readme = "README.md"
publish = ["perish"]

[features]
tokio = ["dep:tokio"]
redis = []
macros = ["dep:radicula-lock-macros"]

[dependencies]
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }
radicula-lock-macros = { workspace = true, optional = true }


[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
