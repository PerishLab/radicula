[package]
name = "radicula-config"
version.workspace = true
edition.workspace = true
license.workspace = true
license-file.workspace = true
repository.workspace = true
description = "Configuration layers with explicit inputs"
readme = "README.md"
publish = ["perish"]

[dependencies]
radicula-config-macros.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
tempfile = "3"
