[[boundary]]
allow = ["fanout"]
note = "The user-defined crates directory is a flat catalogue of independently published Rust packages, including optional procedural macro packages. Preserve crates/{context,trace,trace-macros,...} rather than introducing artificial package groups; every package source and test module retains the ordinary fanout and depth limits."
paths = ["crates"]

[[boundary]]
allow = ["word"]
note = "The isolated which::sys::Sys adapter implements the upstream trait's required associated type and method names; captured PATH/PATHEXT must not fall back to ambient process state."
paths = ["crates/process/src/search/system.rs"]

[[boundary]]
allow = ["word"]
note = "The isolated test sink implements the upstream tokio::io::AsyncWrite method names to exercise owned stream failure and panic."
paths = ["crates/process/tests/support/sink.rs"]

[comment]
allow = false

[[grant]]
paths = ["crates/git/src/lib.rs"]
syntax = "embed"

[[grant]]
paths = [
    "crates/*/src/**/*.rs",
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "test"

[[grant]]
paths = [
    "crates/*/tests/**/*.rs",
    "packages/*/tests/**/*.test.ts",
    "packages/*/tests/**/*.test.tsx",
]
syntax = "environment"

[limit]
block = 4
fanout = 10
file = 300
markup = 8
param = 4
path = 3

[module]
roots = [
    "crates/*/src",
    "crates/*/tests",
    "packages/*/src",
    "packages/*/tests",
]

[scan]
exclude = [
    "**/dist/**",
    "**/node_modules/**",
    "**/target/**",
]
include = [
    "crates/**/*.rs",
    "packages/**/*.css",
    "packages/**/*.scss",
    "packages/**/*.ts",
    "packages/**/*.tsx",
]

[[vocabulary.term]]
description = "The public JavaScript connection and address field specified for the document SDK's relative service base."
name = "base_rel_path"

[word]
single = true
