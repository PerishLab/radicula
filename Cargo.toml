[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/PerishLab/radicula"

[workspace.dependencies]
radicula-lock-macros = { path = "crates/lock-macros", version = "=0.0.0", registry = "perish" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
