[identity]
ns = "radicula"

[dependency]
root = true
ecosystem = "cargo"

[dependency.groups]
config = ["radicula-config", "radicula-config-macros"]
lock = ["radicula-lock", "radicula-lock-macros"]
git = ["radicula-git"]
process = ["radicula-process"]
http = ["radicula-http"]
oidc = ["radicula-oidc"]
socket = ["radicula-socket"]
crypto = ["radicula-crypto"]
template = ["radicula-template"]
context = ["radicula-context"]
document = ["radicula-document"]
trace = ["radicula-trace", "radicula-trace-macros"]

[release]
authority = "https://releases.radicula.perish.uk"
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[release.cargo]
registry = "perish"
packages = ["radicula-socket", "radicula-crypto", "radicula-document", "radicula-oidc", "radicula-lock", "radicula-lock-macros", "radicula-git", "radicula-process", "radicula-http", "radicula-template", "radicula-config", "radicula-config-macros", "radicula-context", "radicula-trace", "radicula-trace-macros"]

[release.npm]
registry = "https://npm.pkg.github.com/"
packages = ["@perishlab/radicula-document"]

[[layout.seat]]
path = "packages/*"
anchor = ["package.json"]
note = "Publishable JavaScript libraries in Radicula's release."

[[layout.file]]
name = ["package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".npmrc"]
note = "JavaScript workspace and public registry configuration."

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Public libraries with distinct API contracts and tests in one closed root workspace."

[[layout.seat]]
path = ".cargo"
note = "Public domain registry configuration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Virtual workspace and the repository's unified dependency resolution."

[[ectropy.boundary]]
allow = ["fanout"]
note = "The user-defined crates directory is a flat catalogue of independently published Rust packages, including optional procedural macro packages. Preserve crates/{context,trace,trace-macros,...} rather than introducing artificial package groups; every package source and test module retains the ordinary fanout and depth limits."
paths = ["crates"]

[[ectropy.grant]]
paths = ["crates/git/src/lib.rs"]
syntax = "embed"
