[identity]
ns = "radicula"

[dependency]
root = true

[dependency.groups]
config = ["radicula-config", "radicula-config-macros"]
lock = ["radicula-lock", "radicula-lock-macros"]
git = ["radicula-git"]
process = ["radicula-process"]
http = ["radicula-http"]
template = ["radicula-template"]
context = ["radicula-context"]
trace = ["radicula-trace", "radicula-trace-macros"]

[release]
authority = "https://releases.radicula.perish.uk"
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
]

[release.cargo]
registry = "perish"
packages = ["radicula-lock", "radicula-lock-macros", "radicula-git", "radicula-process", "radicula-http", "radicula-template", "radicula-config", "radicula-config-macros", "radicula-context", "radicula-trace", "radicula-trace-macros"]

[[layout.seat]]
path = "crates/*"
anchor = ["Cargo.toml"]
note = "Public libraries with distinct API contracts and tests in one closed root workspace."

[[layout.seat]]
path = ".cargo"
note = "Public domain registry configuration."

[[layout.file]]
name = ["Cargo.toml", "Cargo.lock"]
note = "Virtual workspace and the repository's unified dependency resolution."
